spring.application.name=betdobem
spring.datasource.url=jdbc:mysql://localhost:3307/betdobem?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
app.jwt.secret=secret
app.admin.password=admin

# constants
app.activity.reward.amount=20
app.activity.daily-limit=2
app.challenge.buy-cost=50
app.challenge.minimum-interval-days-invite-and-deadline=2
app.bet.minimum-interval-days-invite-and-deadline=2
